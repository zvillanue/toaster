[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toaster"
version = "0.1.0"
description = "Create Windows 11 install USB drives on Linux, with the intrusive parts removed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
toaster = "toaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
